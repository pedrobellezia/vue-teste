version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtry-frontend
    ports:
      - "4173:4173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_API_BASE_PATH=${VITE_API_BASE_PATH}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

